<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoteWise — AI Election Assistant</title>
  <meta name="description" content="VoteWise helps you understand elections, voting, and democracy in a simple, interactive, and engaging way. Learn step-by-step, ask questions, take quizzes, and explore election terminology.">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/timeline.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/quiz.css">

  <style>
    /* Home-specific styles */
    .home-hero {
      padding: var(--space-3xl) 0 var(--space-2xl);
      text-align: center;
    }
    .hero-badge { margin-bottom: var(--space-lg); }
    .hero-title {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      margin-bottom: var(--space-md);
      line-height: 1.1;
    }
    .hero-subtitle {
      font-size: var(--text-lg);
      color: var(--color-text-secondary);
      max-width: 600px;
      margin: 0 auto var(--space-xl);
      line-height: 1.7;
    }
    .hero-actions {
      display: flex;
      gap: var(--space-md);
      justify-content: center;
      flex-wrap: wrap;
    }
    .home-stats { margin: var(--space-xl) 0; }

    /* Background canvas */
    #bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>

  <!-- Background Animation Canvas -->
  <canvas id="bg-canvas"></canvas>

  <div class="app-shell">
    <!-- ====== Sidebar ====== -->
    <aside class="sidebar">
      <div class="sidebar-logo" title="VoteWise">V</div>
      <nav class="sidebar-nav">
        <button class="sidebar-nav-item active" data-page="home" id="nav-home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span class="nav-tooltip">Home</span>
        </button>
        <button class="sidebar-nav-item" data-page="timeline" id="nav-timeline">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          <span class="nav-tooltip">Guided Learning</span>
        </button>
        <button class="sidebar-nav-item" data-page="chat" id="nav-chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="nav-tooltip">Chat with VoteWise</span>
        </button>
        <button class="sidebar-nav-item" data-page="quiz" id="nav-quiz">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span class="nav-tooltip">Quiz Mode</span>
        </button>
        <button class="sidebar-nav-item" data-page="glossary" id="nav-glossary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <span class="nav-tooltip">Glossary</span>
        </button>
      </nav>
    </aside>

    <!-- ====== Topbar ====== -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">
          <span class="emoji">🗳️</span>
          <span class="text-gradient">VoteWise</span>
        </div>
        <div class="topbar-breadcrumb">
          <span class="sep">/</span>
          <span id="breadcrumb-page">🏠 Home</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="country-selector" id="country-selector">
          <button class="country-btn" id="country-btn">
            <span class="flag" id="country-flag">🇮🇳</span>
            <span id="country-name">India</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="country-dropdown">
            <button class="country-option active" data-country="india"><span class="flag">🇮🇳</span> India</button>
            <button class="country-option" data-country="usa"><span class="flag">🇺🇸</span> United States</button>
            <button class="country-option" data-country="uk"><span class="flag">🇬🇧</span> United Kingdom</button>
          </div>
        </div>
      </div>
    </header>

    <!-- ====== Main Content ====== -->
    <main class="main-content">
      <!-- Home Page -->
      <section class="page active" id="home-page"></section>

      <!-- Guided Learning -->
      <section class="page" id="timeline-page">
        <div class="section-header">
          <h2>📖 Guided Learning</h2>
          <p>Follow the election journey step by step</p>
        </div>
      </section>

      <!-- Chat -->
      <section class="page" id="chat-page"></section>

      <!-- Quiz -->
      <section class="page" id="quiz-page">
        <div class="section-header">
          <h2>🧠 Quiz Mode</h2>
          <p>Test your election knowledge</p>
        </div>
      </section>

      <!-- Glossary -->
      <section class="page" id="glossary-page"></section>
    </main>
  </div>

  <!-- Scripts (order matters) -->
  <script src="js/data.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/glossary.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
